name: "USB Keystrokes"
author: "ctf-team"
category: forensics
description: |
  Nous avons mis sur écoute le bus USB pendant qu'un collègue se connectait au
  terminal du coffre, et capturé le trafic ci-joint (`capture.pcap`). Quelque
  part dans ce flux se trouve la passphrase qu'il a tapée au clavier.

  La capture est un vidage usbmon Linux brut (ouvrez-la dans Wireshark, ou
  parsez-la vous-même). Plusieurs périphériques étaient branchés à ce moment-là,
  donc tous les paquets ne proviennent pas du clavier.

  Récupérez la passphrase exacte qui a été tapée et soumettez-la au format du
  flag.

  Bloqué ? Des indices sont disponibles (ils coûtent quelques points).

  Flag format : NCTF{<passphrase>}  (la passphrase est sensible à la casse et
  contient lettres, chiffres et underscores).

# This is a static, downloadable forensics artifact: the challenge IS the pcap,
# so the flag is baked in. No served component, no per-team HMAC flag.
# (See flag.py for how a per-team variant would be derived if this were served.)

value: 150
type: dynamic
extra:
  initial: 150
  decay: 30
  minimum: 50

flags:
  - "NCTF{Bl4ck_H4t_USB_2026}"

# Indices progressifs (déverrouillage en chaîne, coût croissant). Le détail de
# la technique n'est PAS dans la description : il se paie ici.
hints:
  - content: >-
      Un clavier reporte l'état des touches par petits paquets sur son endpoint
      d'interruption (interrupt-IN). Plusieurs périphériques sont sur le bus :
      commencez par identifier lequel est le clavier (par longueur de rapport et
      adresse de périphérique).
    cost: 10
    key: h1
  - content: >-
      Le clavier envoie des rapports de 8 octets (l'autre périphérique, une
      souris, en fait 4). Dans chaque rapport, l'octet 2 est le keycode (table
      HID Usage, page clavier 0x07) et l'octet 0 est le bitmap de modificateurs.
      Ne gardez que les événements `C` (complete) interrupt-IN porteurs de
      données.
    cost: 15
    key: h2
    requirements: [h1]
  - content: >-
      Mappez chaque keycode via la table HID, appliquez Shift depuis l'octet 0
      (b→B, -→_, 2→@ …) et ignorez les rapports « release » tout-à-zéro. Par
      exemple :
      `tshark -Y 'usb.device_address==3 && usb.transfer_type==0x01 && usb.capdata' -e usb.capdata -T fields`.
    cost: 25
    key: h3
    requirements: [h2]

files:
  - capture.pcap

tags:
  - forensics
  - easy

# No requirements / prerequisite chain for this standalone challenge.
