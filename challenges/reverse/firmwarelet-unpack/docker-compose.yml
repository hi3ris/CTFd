# Local run notes for reverse-firmwarelet-unpack (STUB).
#   docker build -t ctf-reverse-firmwarelet-unpack:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  reverse-firmwarelet-unpack:
    image: ctf-reverse-firmwarelet-unpack:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
