# Local run notes for reverse-vmcore-vmesc (STUB).
#   docker build -t ctf-reverse-vmcore-vmesc:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  reverse-vmcore-vmesc:
    image: ctf-reverse-vmcore-vmesc:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
