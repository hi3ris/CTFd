# Local run notes for reverse-vm-escape (STUB).
#   docker build -t ctf-reverse-vm-escape:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  reverse-vm-escape:
    image: ctf-reverse-vm-escape:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
