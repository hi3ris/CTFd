# Local run notes for reverse-license-forge (STUB).
#   docker build -t ctf-reverse-license-forge:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  reverse-license-forge:
    image: ctf-reverse-license-forge:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
