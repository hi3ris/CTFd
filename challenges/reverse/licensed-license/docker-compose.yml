# Local run notes for reverse-licensed-license (STUB).
#   docker build -t ctf-reverse-licensed-license:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  reverse-licensed-license:
    image: ctf-reverse-licensed-license:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
