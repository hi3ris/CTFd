# Local run notes for blockchain-reentry-chain (STUB).
#   docker build -t ctf-blockchain-reentry-chain:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  blockchain-reentry-chain:
    image: ctf-blockchain-reentry-chain:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
