# Local run notes for blockchain-lender-allowance (STUB).
#   docker build -t ctf-blockchain-lender-allowance:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  blockchain-lender-allowance:
    image: ctf-blockchain-lender-allowance:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
