# Local run notes for blockchain-oraclefeed-proxy (STUB).
#   docker build -t ctf-blockchain-oraclefeed-proxy:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  blockchain-oraclefeed-proxy:
    image: ctf-blockchain-oraclefeed-proxy:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
