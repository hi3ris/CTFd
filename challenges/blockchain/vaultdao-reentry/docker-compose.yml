# Local run notes for blockchain-vaultdao-reentry (STUB).
#   docker build -t ctf-blockchain-vaultdao-reentry:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  blockchain-vaultdao-reentry:
    image: ctf-blockchain-vaultdao-reentry:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
