name: lockfile-integrity-drift
author: dagbanjaphet
category: supplychain
description: |-
  On vous fournit un `package-lock.json` et les archives `.tgz` qu'il verrouille.
  Le lockfile épingle une empreinte d'intégrité pour chaque dépendance, mais une
  des archives livrées ne serait plus celle d'origine.

  Identifiez l'archive qui ne correspond pas à son empreinte, ouvrez-la et
  récupérez le flag.

  Stuck? Hints are available (they cost a few points).

  Flag format: NCTF{...}
value: 300
type: dynamic
extra:
  initial: 300
  decay: 25
  minimum: 100
flags:
  - NCTF{1ntegrity_hash_mismatch_carries_flag_d3e1}
hints:
  - content: >-
      Le champ `integrity` est une SRI : `sha512-` suivi du hash SHA-512 encodé
      en base64. Vous pouvez le recalculer vous-même sur chaque `.tgz`.
    cost: 15
    key: h1
  - content: >-
      Une seule archive ne produit pas le hash épinglé : elle a été remplacée
      après l'écriture du lockfile. C'est celle-là qui est malveillante — lisez
      son `index.js` et décodez la valeur base64 qu'il contient.
    cost: 30
    key: h2
    requirements: [h1]
tags:
  - supplychain
  - lockfile
  - integrity
  - medium
files:
  - package-lock.json
  - left-pad-1.3.0.tgz
  - ansi-styles-6.2.1.tgz
  - semver-7.5.4.tgz
  - minimist-1.2.8.tgz
state: visible
version: "0.1"
