# Local run notes for supplychain-releaser-depconf (STUB).
#   docker build -t ctf-supplychain-releaser-depconf:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  supplychain-releaser-depconf:
    image: ctf-supplychain-releaser-depconf:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
