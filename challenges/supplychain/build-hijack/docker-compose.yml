# Local run notes for supplychain-build-hijack (STUB).
#   docker build -t ctf-supplychain-build-hijack:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  supplychain-build-hijack:
    image: ctf-supplychain-build-hijack:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
