name: build-hijack
author: ctf-2026
category: supplychain
type: team_instance
description: |
  Dérive de lockfile -> paquet attaquant -> hook post-install exécuté.

  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 550
extra:
  docker_image: ctf-supplychain-build-hijack:latest
  internal_port: 8080
  initial: 550
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: supplychain-build-hijack

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      Le résolveur interroge aussi un registre public en plus du lockfile. Sur quel critère choisit-il la version gagnante ?
    cost: 20
    key: h1
  - content: >-
      POST /publish-public internal-lib en version > 1.0.0 avec buildhook=emit-flag, puis GET /resolve?name=internal-lib.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - supplychain
  - cve

# challenge-id (HMAC / requirements wiring): supplychain-build-hijack
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: hidden  # IMPLEMENTED + locally verified end-to-end (ported); flip to visible after Lot-5 Docker rehearsal
version: "1.0"
