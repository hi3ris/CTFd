name: typosquat-lockfile
author: dagbanjaphet
category: supplychain
description: |-
  On vous donne le `package-lock.json` d'un projet front-end et toutes les
  archives `.tgz` qu'il verrouille. L'audit sécurité pense qu'une dépendance
  n'est pas ce qu'elle prétend être.

  Trouvez la dépendance frauduleuse, ouvrez son archive et récupérez le flag
  qu'elle transporte.

  Stuck? Hints are available (they cost a few points).

  Flag format: NCTF{...}
value: 150
type: dynamic
extra:
  initial: 150
  decay: 35
  minimum: 50
flags:
  - NCTF{typ0squ4t_expres_not_express_7c2e}
hints:
  - content: >-
      Comparez le champ `resolved` de chaque entrée du lockfile. Les vrais
      paquets viennent tous du même registre.
    cost: 10
    key: h1
  - content: >-
      Une seule dépendance est servie depuis un autre hôte, et son nom ressemble
      de très près à un paquet populaire (une lettre de différence). Ouvrez son
      `.tgz` et lisez `index.js`.
    cost: 15
    key: h2
    requirements: [h1]
tags:
  - supplychain
  - typosquat
  - npm
  - easy
files:
  - package-lock.json
  - express-4.18.2.tgz
  - lodash-4.17.21.tgz
  - chalk-5.3.0.tgz
  - expres-4.18.9.tgz
  - debug-4.3.4.tgz
state: visible
version: "0.1"
