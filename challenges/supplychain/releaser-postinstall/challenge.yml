name: releaser-postinstall
author: ctf-2026
category: supplychain
type: team_instance
description: |
  Hook post-install -> exécution -> vol de secret.

  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 500
extra:
  docker_image: ctf-supplychain-releaser-postinstall:latest
  internal_port: 8080
  initial: 500
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: supplychain-releaser-postinstall

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      L'installateur exécute le hook post-install du paquet. Qui peut publier un paquet ici ?
    cost: 20
    key: h1
  - content: >-
      Publie via POST /publish un paquet dont postinstall=emit-flag, puis GET /install?pkg=<nom> — la sortie contient le flag.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - supplychain

# challenge-id (HMAC / requirements wiring): supplychain-releaser-postinstall
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: hidden  # IMPLEMENTED + locally verified end-to-end (ported); flip to visible after Lot-5 Docker rehearsal
version: "1.0"
