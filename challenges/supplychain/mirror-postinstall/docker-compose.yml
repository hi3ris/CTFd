# Local run notes for supplychain-mirror-postinstall (STUB).
#   docker build -t ctf-supplychain-mirror-postinstall:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  supplychain-mirror-postinstall:
    image: ctf-supplychain-mirror-postinstall:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
