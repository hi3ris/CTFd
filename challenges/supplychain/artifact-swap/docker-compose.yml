# Local run notes for supplychain-artifact-swap (STUB).
#   docker build -t ctf-supplychain-artifact-swap:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  supplychain-artifact-swap:
    image: ctf-supplychain-artifact-swap:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
