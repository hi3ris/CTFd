name: provenance-forgery
author: dagbanjaphet
category: supplychain
description: |-
  Chaque release de `acme-app` est accompagnée d'une attestation de provenance
  signée (dossier `provenance/`) et de son archive `.tgz`. La clé de signature
  du CI a fuité (`ci-signing.key`). L'une des releases n'a pas été produite par
  le vrai pipeline.

  Vérifiez les attestations, démasquez la release forgée et récupérez le flag
  que porte son artefact.

  Stuck? Hints are available (they cost a few points).

  Flag format: NCTF{...}
value: 300
type: dynamic
extra:
  initial: 300
  decay: 25
  minimum: 100
flags:
  - NCTF{w3ak_provenance_sig_forged_release_4e7a}
hints:
  - content: >-
      Le fichier `ci-signing.key` contient à la fois la clé ET le schéma de
      signature. Vous pouvez donc vérifier chaque attestation vous-même,
      hors-ligne.
    cost: 15
    key: h1
  - content: >-
      Pour chaque release, recalculez le SHA-256 de l'archive livrée et la
      signature attendue. La release forgée est celle dont la signature (et le
      digest) ne collent pas.
    cost: 30
    key: h2
    requirements: [h1]
  - content: >-
      Dans l'archive de la release forgée, `dist/app.js` définit une variable
      `_t` en base64. Décodez-la.
    cost: 45
    key: h3
    requirements: [h2]
tags:
  - supplychain
  - provenance
  - slsa
  - medium
files:
  - ci-signing.key
  - provenance/1.0.0.intoto.json
  - provenance/1.1.0.intoto.json
  - provenance/1.2.0.intoto.json
  - provenance/1.3.0.intoto.json
  - acme-app-1.0.0.tgz
  - acme-app-1.1.0.tgz
  - acme-app-1.2.0.tgz
  - acme-app-1.3.0.tgz
state: visible
version: "0.1"
