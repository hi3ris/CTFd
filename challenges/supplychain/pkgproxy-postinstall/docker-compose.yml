# Local run notes for supplychain-pkgproxy-postinstall (STUB).
#   docker build -t ctf-supplychain-pkgproxy-postinstall:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  supplychain-pkgproxy-postinstall:
    image: ctf-supplychain-pkgproxy-postinstall:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
