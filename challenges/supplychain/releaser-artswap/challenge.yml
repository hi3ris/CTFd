name: releaser-artswap
author: ctf-2026
category: supplychain
type: team_instance
description: |
  Provenance forgée -> substitution d'artefact -> exécution au déploiement.

  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 500
extra:
  docker_image: ctf-supplychain-releaser-artswap:latest
  internal_port: 8080
  initial: 500
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: supplychain-releaser-artswap

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      La provenance est-elle vraiment signée, ou juste des champs que tu peux recopier ?
    cost: 20
    key: h1
  - content: >-
      artifact='on-deploy: emit-flag' + provenance {builder:trusted-builder, digest:sha256(artifact)} sur POST /deploy.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - supplychain

# challenge-id (HMAC / requirements wiring): supplychain-releaser-artswap
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: hidden  # IMPLEMENTED + locally verified end-to-end (ported); flip to visible after Lot-5 Docker rehearsal
version: "1.0"
