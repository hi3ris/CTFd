# Local run notes for ml-trainer-pickle (STUB).
#   docker build -t ctf-ml-trainer-pickle:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  ml-trainer-pickle:
    image: ctf-ml-trainer-pickle:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
