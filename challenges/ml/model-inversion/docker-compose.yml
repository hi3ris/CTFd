# Local run notes for authors / playtesters. In production the platform
# instancer injects a per-team CHALLENGE_SECRET / FLAG. This file is only for a
# local build + smoke test.
#
#   docker compose up --build
#   # browse http://localhost:8080/  and grab the artifacts from /assets/
#   # then:  python3 solution/solve.py http://localhost:8080
#
# No GPU required: the oracle is a tiny NumPy bilinear scorer over 24-d probes.
services:
  vault:
    build:
      context: .
    image: ctf-model-inversion:latest
    ports:
      - "8080:8080"
    environment:
      # local demo value ONLY -- never ship this
      TEAM_SECRET: "local-demo-team-secret"
      RECORD_TOL: "2"
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
