name: pickle-rce
author: dagbanjaphet
category: ml
description: |
  **ModelHub** is a model registry. Teams upload a serialized model and the
  registry "validates" it by loading it and returning a short summary of the
  loaded object. The serialization format is a plain Python **pickle** -- the
  same thing `joblib`, `sklearn` and `torch.save` write under the hood.

  Loading attacker-controlled pickles is the classic remote-code-execution
  primitive (`__reduce__`). The registry knows this, so it loads inside a
  **restricted unpickler** that refuses to import dangerous modules
  (`os`, `subprocess`, `sys`, `builtins`, `importlib`, ...). When it refuses a
  class it tells you exactly which module tripped the guard -- probe it to learn
  the guard's shape. The guard is a *denylist*, and it only ever looks at the
  classes named by GLOBAL opcodes; it does not constrain what an already-allowed
  callable does, nor how many callables you chain on the pickle stack.

  There is **no downloadable flag**. This team's flag is written to a file on
  the service host (`/flag`) at container start and is never part of any normal
  response. The registry will not read it for you. The only way it comes back is
  if the object your pickle deserializes to *is* the flag -- i.e. you executed
  code during unpickling and made the loaded value read that file. The service
  returns `repr(loaded_object)`; it does not inspect or expect any particular
  payload shape. It verifies the effect, then hands you whatever your object is.

  Endpoints (see `GET /`):
    - `POST /validate` with the raw pickle as the body, or multipart field
      `model`. Returns JSON with `model_summary` (a repr) or a `rejected` /
      `error` reason.

  Handout: a short API note plus a benign example `.pkl` so you can see the
  round-trip and the exact rejection-message format before you weaponize it.

  Decoy: the host has a stale `/flag.decoy` placeholder from an old fixture. It
  is not a flag -- read it once and you will see. Don't submit it.

  Flag format: `CTF{...}`

value: 350
type: team_instance
extra:
  docker_image: ctf-pickle-rce:latest
  internal_port: 9080
  initial: 350
  decay: 25
  minimum: 100

# This challenge is served per-team. The flag is dynamic:
#   flag = "CTF{" + HMAC_SHA256(TEAM_SECRET, "ml-pickle-rce")[:24] + "}"
# It is written to /flag inside the running instance and only comes back through
# the service if the player achieves code execution during unpickling.
# CTFd validates the real per-team flag via the custom HMAC flag class; the
# static entry below is only the placeholder for the demo TEAM_SECRET used in
# local builds.
flags:
  - type: team_hmac
    content: ml-pickle-rce
tags:
  - ml
  - pickle
  - deserialization
  - rce
  - sandbox-escape
  - web

# challenge-id (for HMAC / requirements wiring): ml-pickle-rce
# No prerequisites; standalone.

files:
  - handout/README.md
  - handout/example_model.pkl

connection_info: http://{host}:9080

state: visible
version: "0.1"

# Served challenge -- image must be named ctf-pickle-rce:latest so
# `make push-images` finds it.
