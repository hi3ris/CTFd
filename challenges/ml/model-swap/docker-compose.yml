# Local run notes for ml-model-swap (STUB).
#   docker build -t ctf-ml-model-swap:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  ml-model-swap:
    image: ctf-ml-model-swap:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
