name: adversarial-gate
author: dagbanjaphet
category: ml
description: |
  **SENTRY-6 badge gate.** An access gate runs a small convolutional
  classifier over a 32x32 grayscale "badge scan" and sorts it into one of six
  clearance classes: `DENIED, STAFF, VISITOR, CONTRACTOR, AUDITOR, GRANTED`.
  The gate opens **only** for `GRANTED`.

  You are given the classifier weights (white-box) and a badge that scans as
  `DENIED`. Get the gate to read a badge as **GRANTED** while keeping every
  pixel within **8 levels** (raw 0..255) of the DENIED badge -- i.e.
  `max|badge - DENIED| <= 8` -- then submit it to the live instance.

  The service is the oracle. `POST /submit` **verifies the effect, not a
  payload shape**: it decodes your packet, checks `max|badge - DENIED| <= 8`,
  runs the real classifier, and emits the flag **only** when the decoded badge
  is classified GRANTED. Unlimited attempts, never penalised. The flag is never
  present in any downloadable artifact.

  Submissions are wrapped in an invented container, **QGP1** (not PNG/NPY/DER).
  The instance serves a small corpus of `.gatepkt` samples plus two decoded
  `.npy` files under `/assets/`, and the codec/model source ship in the handout;
  work out the exact wire format from that evidence.

  Handout files include `gatemodel.py`, `weights.npz`, the DENIED badge
  (`denied_badge.gatepkt` / `.npy`) and the labelled sample corpus.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

value: 500
type: team_instance
extra:
  docker_image: ctf-adversarial-gate:latest
  internal_port: 8080
  initial: 500
  decay: 25
  minimum: 100

# Served per-team. The flag is dynamic:
#   flag = "NCTF{" + HMAC_SHA256(TEAM_SECRET, "ml-adversarial-gate")[:24] + "}"
# emitted by the running instance ONLY after /submit confirms (server side)
# that the submitted badge is within L-inf epsilon of the DENIED badge AND is
# classified GRANTED by the real model (effect verification, authoring rule #1).
# The classifier weights and DENIED badge are common to all teams (the artifact
# IS the challenge); only the flag is per-team. flag.py reproduces the flag from
# TEAM_SECRET so CTFd's custom HMAC flag class can validate per team.
#
# The static flag below is a placeholder for the local-demo TEAM_SECRET only;
# production validates the real per-team flag, so no usable static flag ships.
flags:
  - type: team_hmac
    content: ml-adversarial-gate

# Progressive hints (chained unlock, growing cost). The technique is NOT in the
# description -- it is paid for here.
hints:
  - content: >-
      The classifier is white-box and nearly linear in the tiny pixel budget
      around the DENIED badge. Its own gradient tells you which pixels to nudge:
      `gatemodel.py` even exposes the analytic gradient of a class logit w.r.t.
      the raw pixels. Ascend it.
    cost: 25
    key: h1
  - content: >-
      Aim at GRANTED **specifically** -- ascend `logit[GRANTED]`. A single
      untargeted step increases the loss toward the *nearest* boundary, which is
      the STAFF decoy, and the gate still refuses that. Iterate (PGD-style),
      re-clipping every step to `denied +/- 8`.
    cost: 50
    key: h2
    requirements: [h1]
  - content: >-
      The epsilon check is on the decoded **integer** pixel plane: project to
      `uint8` *inside* the loop and keep a margin, or a float attack that is
      "just inside" before rounding gets rejected. Then encode the result as
      QGP1 -- from the samples vs. their `.npy`: rows stored bottom-to-top when
      `flags & 1`, `hdr_sum` checksums the header only, and the count field
      counts records (== nrows), each record `[len=ncols][ncols bytes]`.
    cost: 75
    key: h3
    requirements: [h2]

# Handout artifacts delivered to players (white-box: weights + DENIED badge in
# both the invented QGP1 .gatepkt container and decoded .npy, plus the codec and
# model source and a small labelled sample corpus). No flag is present in any of
# these; the flag is emitted only by the live instance after effect verification.
files:
  - handout/README.md
  - handout/gatemodel.py
  - handout/weights.npz
  - handout/denied_badge.gatepkt
  - handout/denied_badge.npy
  - handout/samples/badge_00.gatepkt
  - handout/samples/badge_00.npy
  - handout/samples/badge_01.gatepkt
  - handout/samples/badge_01.npy
  - handout/samples/badge_02.gatepkt
  - handout/samples/badge_03.gatepkt
  - handout/samples/badge_04.gatepkt
  - handout/samples/badge_05.gatepkt
tags:
  - ml
  - hard

connection_info: http://{host}:8080/

state: visible
version: "0.1"

# Served challenge -- image must be named ctf-adversarial-gate:latest so
# `make push-images` finds it. CPU-only; no GPU or model download required.
# --- Prerequisite chain ----------------------------------------------------
# Standalone (no prerequisite). If wired into an ML track later, prerequisites
# are attached by challenge ID at import time, e.g.:
