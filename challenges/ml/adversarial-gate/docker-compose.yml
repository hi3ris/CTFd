# Local run notes for authors / playtesters. In production the platform
# instancier injects a per-team TEAM_SECRET. This file is only for a local
# build + smoke test.
#
#   docker compose up --build
#   # browse http://localhost:8080/  and grab the artifacts from /assets/
#   # then:  python3 solution/solve.py http://localhost:8080
#
# No GPU required: the classifier is a tiny NumPy CNN scoring 32x32 inputs.
services:
  gate:
    build:
      context: .
    image: ctf-adversarial-gate:latest
    ports:
      - "8080:8080"
    environment:
      # local demo value ONLY -- never ship this
      TEAM_SECRET: "local-demo-team-secret"
      GATE_EPS: "8"
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
