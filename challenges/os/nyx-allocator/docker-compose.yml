# Local run notes for os-nyx-allocator (STUB).
#   docker build -t ctf-os-nyx-allocator:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  os-nyx-allocator:
    image: ctf-os-nyx-allocator:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
