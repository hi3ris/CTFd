# Local run notes for misc-deserial-chain (STUB).
#   docker build -t ctf-misc-deserial-chain:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  misc-deserial-chain:
    image: ctf-misc-deserial-chain:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
