# Local run notes for misc-transcoder-deser (STUB).
#   docker build -t ctf-misc-transcoder-deser:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  misc-transcoder-deser:
    image: ctf-misc-transcoder-deser:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
