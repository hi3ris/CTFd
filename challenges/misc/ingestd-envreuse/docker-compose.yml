# Local run notes for misc-ingestd-envreuse (STUB).
#   docker build -t ctf-misc-ingestd-envreuse:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  misc-ingestd-envreuse:
    image: ctf-misc-ingestd-envreuse:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
