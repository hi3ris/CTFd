name: relaynode-envreuse
author: ctf-2026
category: misc
type: team_instance
description: |
  Fuite d'env -> réutilisation de secret -> exécution.

  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 450
extra:
  docker_image: ctf-misc-relaynode-envreuse:latest
  internal_port: 8080
  initial: 450
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: misc-relaynode-envreuse

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      L'endpoint de debug dump-t-il quelque chose qui devrait rester secret ?
    cost: 20
    key: h1
  - content: >-
      Lis WORKER_HMAC_SECRET dans /debug/env, signe emit-flag, POST /task.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - misc

# challenge-id (HMAC / requirements wiring): misc-relaynode-envreuse
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # IMPLEMENTED + locally verified end-to-end (ported); flip to visible after Lot-5 Docker rehearsal; Lot-5 rehearsal passed 2026-09-23
version: "1.0"
