# Local run notes for misc-gluesvc-protoparse (STUB).
#   docker build -t ctf-misc-gluesvc-protoparse:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  misc-gluesvc-protoparse:
    image: ctf-misc-gluesvc-protoparse:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
