name: sessiond-kdf
author: ctf-2026
category: crypto
type: team_instance
description: |
  Dérivation de clé faible -> prédiction -> reprise de session.

  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 500
extra:
  docker_image: ctf-crypto-sessiond-kdf:latest
  internal_port: 8080
  initial: 500
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: crypto-sessiond-kdf

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      La clé serveur dérive d'une graine à 4 chiffres. Combien de clés possibles, et que t'offre /login ?
    cost: 20
    key: h1
  - content: >-
      KDF faible : brute-force 0000-9999, K=SHA256('nctf-kdf-'+seed), vérifie HMAC(K,'guest') contre le jeton observé, puis forge HMAC(K,'admin').
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - crypto

# challenge-id (HMAC / requirements wiring): crypto-sessiond-kdf
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: hidden  # IMPLEMENTED + locally verified end-to-end (ported); flip to visible after Lot-5 Docker rehearsal
version: "1.0"
