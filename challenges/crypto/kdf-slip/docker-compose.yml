# Local run notes for crypto-kdf-slip (STUB).
#   docker build -t ctf-crypto-kdf-slip:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  crypto-kdf-slip:
    image: ctf-crypto-kdf-slip:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
