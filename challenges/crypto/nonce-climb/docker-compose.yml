# Local run notes for crypto-nonce-climb (STUB).
#   docker build -t ctf-crypto-nonce-climb:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  crypto-nonce-climb:
    image: ctf-crypto-nonce-climb:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
