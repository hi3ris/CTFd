name: notarysvc-ecb
author: ctf-2026
category: crypto
type: team_instance
description: |
  ECB cut-and-paste -> contournement d'auth -> action privilégiée.

  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 450
extra:
  docker_image: ctf-crypto-notarysvc-ecb:latest
  internal_port: 8080
  initial: 450
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: crypto-notarysvc-ecb

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      Le token chiffre name=<toi>&role=user en AES-ECB. Que permet le chiffrement bloc-par-bloc indépendant ?
    cost: 20
    key: h1
  - content: >-
      ECB cut-and-paste : obtiens un bloc = ECB('admin'+padding) via name, puis aligne un token pour que le dernier bloc soit la valeur de role, et recolle les blocs.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - crypto
  - medium

# challenge-id (HMAC / requirements wiring): crypto-notarysvc-ecb
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # IMPLEMENTED + locally verified end-to-end (ported); Lot-5 rehearsal passed 2026-09-23
version: "1.0"
