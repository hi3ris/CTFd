name: commit-bias
author: dagbanjaphet
category: crypto
description: |
  The **CoinVault** table runs a "provably fair" coin-flip game. Every round the
  dealer first **seals** its draw -- publishing a 16-byte commitment
  `C = SHA256(draw || round)` -- and only later **opens** the round, revealing
  the full draw so anyone can recheck the seal. The published coin of a round is
  just the parity of that round's draw.

  We captured one table's session in `ledger.coinvault`: 48 fully opened rounds,
  followed by a final **vault** round that the dealer **sealed and funded but
  never opened**. The vault's payout blob is XOR-sealed under a key derived from
  that un-opened draw. If the game is truly fair, the vault is unrecoverable and
  the sealed value is anyone's guess.

  Recover the sealed vault draw, unseal the payout blob, and read the flag.
  `SPEC.md` documents the file format (and the exact commitment / sealing
  construction) -- everything you need to parse the ledger and to *check* a
  candidate vault draw against its published commitment.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

value: 300
type: dynamic
extra:
  initial: 300
  decay: 30
  minimum: 100

# --- Static flag ------------------------------------------------------------
# Pure downloadable crypto challenge: the artifact (ledger.coinvault) IS the
# challenge and the flag is fixed. The ledger's opened rounds leak the dealer's
# internal draw stream; recovering it unseals the vault blob to the flag below.
# gen.py rebuilds the ledger and this flag deterministically. Per the authoring
# rules a static flag is correct here (there is no served oracle).
flags:
  - NCTF{c0mmit_r3v34l_but_th3_dr4ws_w3re_l1n34rly_l1nk3d}

# Progressive hints (chained unlock, increasing cost). The vulnerability detail
# lives here, not in the description.
hints:
  - content: >-
      The commitments are a distraction: they only bind the dealer to draws it
      has already chosen, not to how those draws are generated. The weakness is
      in the draw *generation*. The 48 "independent" opened draws are not
      independent -- once you have enough of them, the un-opened vault draw is
      already determined.
    cost: 15
    key: h1
  - content: >-
      The draw stream is the output of a fixed order-k **linear recurrence over
      F_p** with secret coefficients (Y_r = c_1*Y_{r-1} + ... + c_k*Y_{r-k} mod
      p). Recover that recurrence from the opened draws -- Berlekamp-Massey over
      F_p does it with only ~2k samples.
    cost: 30
    key: h2
    requirements: [h1]
  - content: >-
      Run Berlekamp-Massey on the 48 opened draws to get the coefficients
      (order 7), confirm they reproduce every opened draw, then iterate one step
      past round 47 to get Y_vault. Verify it against the published vault
      commitment `SHA256(Y_vault || 48)[:16]`, then key = SHA256(Y_vault_bytes),
      generate the SHA-256 counter-mode keystream and XOR it with the CT.
    cost: 45
    key: h3
    requirements: [h2]

tags:
  - crypto
  - medium

# Files handed to players. Only the ledger export and its parse spec are
# distributed; gen.py and the solution/ directory are NOT shipped.
files:
  - handout/ledger.coinvault
  - handout/SPEC.md

# challenge-id (for requirements wiring): crypto-commit-bias
# No prerequisites; standalone.

state: visible
version: "0.1"

# Not a served challenge: no container, no connection_info, no per-team flag.
