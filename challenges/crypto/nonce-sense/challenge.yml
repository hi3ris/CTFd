name: nonce-sense
author: ctf-2026
category: crypto
type: dynamic

description: |
  A hardware signing device produced a batch of **ECDSA signatures over
  secp256k1**, and we captured them in `capture.json` along with the device's
  public key `Q`.

  The device's random number generator is broken. That is all the hint you
  get about *how* it is broken -- the rest is in the numbers.

  Each entry is a signature `(r, s)` over a message `msg`, with the hash taken
  as `z = int(sha256(msg)) mod n` (secp256k1 group order `n`). Recover the
  device's **private key `d`**.

  Stuck? Hints are available (they cost a few points).

  **Flag:** compute the private key `d`, format it as a 64-character lowercase
  hex string with `"%064x" % d`, and the flag is

      NCTF{ sha256( that 64-char hex string ).hexdigest()[:32] }

  Flag format: `NCTF{<32 lowercase hex chars>}`

# Dynamic scoring (easy).
value: 150
extra:
  initial: 150
  decay: 30
  minimum: 50

# --- Static flag ------------------------------------------------------------
# This is a pure downloadable crypto challenge: the artifact (capture.json) IS
# the challenge and the flag is fixed, derived from the private key that the
# capture leaks through the biased nonces. Per the authoring rules a static
# flag is correct here (there is no served oracle). flag.py reproduces the
# derivation from the private key.
flags:
  - NCTF{1b147fde539c254a8e9bc83bb0b5516d}

# Progressive hints (chained unlock, increasing cost). The vulnerability detail
# lives here, not in the description.
hints:
  - content: >-
      The weakness is in the nonces k, not the messages. The broken RNG produces
      *biased* nonces -- each k is far smaller than the group order. Many
      signatures plus partially-known nonces is the textbook Hidden Number
      Problem. And beware a decoy: two signatures that look like a reused nonce
      are not -- always verify a candidate d against Q before trusting it.
    cost: 10
    key: h1
  - content: >-
      Every nonce has its most-significant byte forced to zero, i.e.
      0 < k < 2**248. From s = k^-1 (z + r*d) mod n, write k = a + t*d mod n with
      a = s^-1*z and t = s^-1*r; small k across many sigs is HNP, solved by
      lattice reduction (LLL). The two signatures sharing an r are k and n-k
      (same x-coordinate, not reuse): they are full-range, unbiased, and must be
      dropped.
    cost: 15
    key: h2
    requirements: [h1]
  - content: >-
      Pick a reference signature to eliminate d (d = (k0 - a0)*t0^-1), giving
      k_i = c_i*k0 + e_i mod n. Recenter each k by 2**247 and build the Kannan
      embedding lattice with K = 2**247, LLL-reduce, and for each short row read
      k_i, then d = (k_i - a_i)*t_i^-1 mod n; accept the d with d*G = Q. Use ~40+
      biased signatures for margin.
    cost: 25
    key: h3
    requirements: [h2]

tags:
  - crypto
  - medium

# Files handed to players. Only capture.json is distributed; the solution/
# directory (writeup, solver, generator) is NOT shipped.
files:
  - capture.json

# Prerequisite chain: none. Standalone challenge.
# (If wired into a chain, prereqs are set by challenge ID at import time via a
#  'requirements' key referencing the upstream challenge id, e.g.
#  requirements: [crypto-nonce-sense].)

# Not a served challenge: no container, no connection_info, no per-team flag.
