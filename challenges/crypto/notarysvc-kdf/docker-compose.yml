# Local run notes for crypto-notarysvc-kdf (STUB).
#   docker build -t ctf-crypto-notarysvc-kdf:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  crypto-notarysvc-kdf:
    image: ctf-crypto-notarysvc-kdf:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
