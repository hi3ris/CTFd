name: sessiond-signext
author: ctf-2026
category: crypto
type: team_instance
description: |
  Extension de hash -> forge -> API privilégiée.

  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 500
extra:
  docker_image: ctf-crypto-sessiond-signext:latest
  internal_port: 8080
  initial: 500
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: crypto-sessiond-signext

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      sig = SHA256(secret || msg). Ce n'est pas un HMAC. Que peux-tu calculer sans connaître le secret ?
    cost: 20
    key: h1
  - content: >-
      Extension de longueur SHA-256 : depuis (msg,sig) forge le MAC de msg||glue||'&op=grantflag' en reprenant l'état SHA-256; brute-force la longueur du secret.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - crypto

# challenge-id (HMAC / requirements wiring): crypto-sessiond-signext
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: hidden  # IMPLEMENTED + locally verified end-to-end (ported); flip to visible after Lot-5 Docker rehearsal
version: "1.0"
