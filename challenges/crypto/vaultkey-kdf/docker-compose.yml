# Local run notes for crypto-vaultkey-kdf (STUB).
#   docker build -t ctf-crypto-vaultkey-kdf:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  crypto-vaultkey-kdf:
    image: ctf-crypto-vaultkey-kdf:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
