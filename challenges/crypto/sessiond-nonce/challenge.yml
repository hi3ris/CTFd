name: sessiond-nonce
author: ctf-2026
category: crypto
type: team_instance
description: |
  Réutilisation de nonce -> récupération de clé -> forge de jeton.

  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 450
extra:
  docker_image: ctf-crypto-sessiond-nonce:latest
  internal_port: 8080
  initial: 450
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: crypto-sessiond-nonce

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      Compare deux signatures renvoyées par /sign. Que remarques-tu sur la valeur r ?
    cost: 20
    key: h1
  - content: >-
      Nonce ECDSA réutilisé : r identique => k puis d se récupèrent (k=(z1-z2)/(s1-s2), d=(s1*k-z1)/r mod n). Signe la commande admin toi-même.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - crypto

# challenge-id (HMAC / requirements wiring): crypto-sessiond-nonce
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # Lot-5 rehearsal passed
version: "1.0"
