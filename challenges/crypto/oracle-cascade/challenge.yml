name: oracle-cascade
author: ctf-2026
category: crypto
type: team_instance
description: |
  Oracle de padding -> cookie forgé -> endpoint admin atteint.

  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 500
extra:
  docker_image: ctf-crypto-oracle-cascade:latest
  internal_port: 8080
  initial: 500
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: crypto-oracle-cascade

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      /whoami ne réagit pas pareil selon que le déchiffrement a un padding
      valide ou non. Que peux-tu apprendre d'un seul bit fuité ?
    cost: 20
    key: h1
  - content: >-
      Oracle de padding AES-CBC : récupère l'état intermédiaire d'un bloc
      (déchiffrement octet par octet), puis forge IV = I XOR pad("role=admin")
      (CBC-R). Pas besoin de la clé.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - crypto

# challenge-id (HMAC / requirements wiring): crypto-oracle-cascade
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # IMPLEMENTED + locally verified end-to-end (ported); Lot-5 rehearsal passed 2026-09-23
version: "1.0"
