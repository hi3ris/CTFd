# Local run notes for crypto-sealbox-ecb (STUB).
#   docker build -t ctf-crypto-sealbox-ecb:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  crypto-sealbox-ecb:
    image: ctf-crypto-sealbox-ecb:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
