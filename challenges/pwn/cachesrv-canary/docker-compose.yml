# Local run notes for pwn-cachesrv-canary (STUB).
#   docker build -t ctf-pwn-cachesrv-canary:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  pwn-cachesrv-canary:
    image: ctf-pwn-cachesrv-canary:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
