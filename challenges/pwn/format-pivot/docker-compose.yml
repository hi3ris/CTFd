# Local run notes for pwn-format-pivot (STUB).
#   docker build -t ctf-pwn-format-pivot:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  pwn-format-pivot:
    image: ctf-pwn-format-pivot:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
