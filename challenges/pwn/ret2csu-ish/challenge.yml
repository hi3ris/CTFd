name: ret2csu-ish
author: ctf-2026
category: pwn
type: team_instance
description: |
  **ret2csu-ish** -- a statically linked, no-PIE x86-64 binary with a stack
  overflow, no canary, and no win() function. Served as pwn-as-a-service.

  Connect over TCP. Each connection prints a fresh 8-bit **landing key** and
  then reads your payload into a 64-byte stack buffer with a `read()` of
  `0x200` bytes -- a clean linear overflow. There is no `system()` call you can
  reach and no gift function: your objective is to pop a shell in the live
  service and read the flag.

  **Per-connection transform.** Before your bytes land on the stack the program
  adds the printed landing key K to every byte, modulo 256:
  `stack[i] = (input[i] + K) mod 256`. K is regenerated every connection, so a
  hard-coded payload is worthless -- read K from the banner and pre-image your
  bytes live. This is why replay does nothing.

  The flag is **NOT** in the binary. It exists only in the running service
  (per-team, in the process environment and a runtime-only file) and is
  reachable solely by executing code in the process. Reading the downloadable
  binary alone will never yield a flag. There is exactly one decoy `NCTF{...}`
  string in the binary; it is in an unreachable function and is refutable in
  under a minute (nothing calls it, and the real flag is per-team/server-issued).

  Provided files: `chall` (x86-64 ELF, static, not stripped), `chall.c` (source).

  Bloqué ? Des indices sont disponibles (ils coûtent quelques points).

  Connect:  `nc <host> <port>`

  Flag format: `NCTF{...}`  (exactly `NCTF{` + 24 lowercase hex characters + `}`)

# Dynamic scoring (hard).
value: 500
extra:
  docker_image: ctf-ret2csu-ish:latest
  internal_port: 9111
  initial: 500
  decay: 30
  minimum: 100

# --- Per-team dynamic flag -------------------------------------------------
# This challenge is SERVED and the flag is derived per team, so no static flag
# ships in this file. The container derives it at runtime from the injected
# TEAM_SECRET as:
#     flag = "NCTF{" + HMAC_SHA256(TEAM_SECRET, "pwn-ret2csu-ish")[:24] + "}"
# (see flag.py). The platform's custom per-account flag class recomputes and
# validates each team's flag on submission. flags is intentionally left empty.
flags:
  - type: team_hmac
    content: pwn-ret2csu-ish

# Indices progressifs (déverrouillage en chaîne, coût croissant). La technique
# n'est PAS détaillée dans la description : elle se paie ici.
hints:
  - content: >-
      Pas de canari + débordement linéaire = vous contrôlez la pile de retour,
      donc le flux via une chaîne de gadgets (ROP). Comme il n'y a pas de
      `system()`, visez directement l'appel système `execve` : `rax=59`,
      `rdi` = pointeur vers `"/bin/sh"`, `rsi=rdx=0`, puis `syscall`.
    cost: 25
    key: h1
  - content: >-
      Le binaire est entièrement statique et ne contient **aucune** chaîne
      `"/bin/sh"`. Mettez-la en scène vous-même : ROP un `read()` qui écrit
      `"/bin/sh\0"` dans une adresse `.bss` fixe (le no-PIE rend les adresses
      stables), puis pointez `rdi` dessus.
    cost: 50
    key: h2
    requirements: [h1]
  - content: >-
      Pour charger proprement les trois registres d'arguments, servez-vous du
      gadget de marshalling d'arguments façon `__libc_csu_init` embarqué dans le
      binaire (l'indice est dans le nom). N'oubliez pas de pré-imager CHAQUE octet
      de la chaîne via la transformation de la clé K avant l'envoi.
    cost: 75
    key: h3
    requirements: [h2]

# Handout: the static, not-stripped binary for offline analysis plus its source.
# The real flag is per-team and server-issued; the binary carries only a single
# unreachable decoy NCTF{...} string (refutable in under a minute).
files:
  - chall
  - chall.c
tags:
  - pwn
  - hard

# Prerequisite chain: none. This is a standalone challenge.
# (If wired into a chain, prereqs are set by challenge ID at import time via a
#  'requirements' key referencing the upstream challenge id, e.g.:
#     requirements:
#       - pwn-format-string-101   )

# Served challenge: the platform instancier starts one container per team and
# injects TEAM_SECRET. connection_info is templated with the team's host:port.
connection_info: "nc {host} {port}  (per-team instance; use the 'launch' button)"

# Image built from the Dockerfile in this directory; must be named ctf-<name>
# so `make push-images` picks it up.
