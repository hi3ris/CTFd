# Local run notes for pwn-rop-diner (STUB).
#   docker build -t ctf-pwn-rop-diner:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  pwn-rop-diner:
    image: ctf-pwn-rop-diner:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
