# Local run notes for pwn-heap-relay (STUB).
#   docker build -t ctf-pwn-heap-relay:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  pwn-heap-relay:
    image: ctf-pwn-heap-relay:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
