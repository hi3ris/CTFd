# Local run notes for pwn-cachesrv-uaf (STUB).
#   docker build -t ctf-pwn-cachesrv-uaf:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  pwn-cachesrv-uaf:
    image: ctf-pwn-cachesrv-uaf:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
