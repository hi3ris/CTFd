# Local run notes for pwn-sensorhub-sandbox (STUB).
#   docker build -t ctf-pwn-sensorhub-sandbox:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  pwn-sensorhub-sandbox:
    image: ctf-pwn-sensorhub-sandbox:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
