# Local run notes for pwn-sandbox-break (STUB).
#   docker build -t ctf-pwn-sandbox-break:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  pwn-sandbox-break:
    image: ctf-pwn-sandbox-break:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
