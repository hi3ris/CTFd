# Local run notes for pwn-authd-uaf (STUB).
#   docker build -t ctf-pwn-authd-uaf:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  pwn-authd-uaf:
    image: ctf-pwn-authd-uaf:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
