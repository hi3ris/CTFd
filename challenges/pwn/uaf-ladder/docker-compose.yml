# Local run notes for pwn-uaf-ladder (STUB).
#   docker build -t ctf-pwn-uaf-ladder:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  pwn-uaf-ladder:
    image: ctf-pwn-uaf-ladder:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
