# Local run notes for pwn-cachesrv-fmt (STUB).
#   docker build -t ctf-pwn-cachesrv-fmt:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  pwn-cachesrv-fmt:
    image: ctf-pwn-cachesrv-fmt:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
