name: mass-assignment
author: dagbanjaphet
category: web
description: |-
  A profile service ships as source, plus the user store and a captured request
  from the mobile app updating a display name. An admin-only endpoint returns
  the flag; the captured account is a plain member.

  Endpoints (from the source):

      PATCH /api/me         -> update your profile
      GET   /api/me/flag    -> admins only; returns the flag

  No live service. Figure out the body that turns the shipped member into an
  admin, then reproduce what the flag endpoint would return.

  Stuck? Hints are available (they cost a few points).

  Flag format: NCTF{...}
value: 300
type: dynamic
extra:
  initial: 300
  decay: 25
  minimum: 100
flags:
  - NCTF{mass_assignment_promoted_me_to_admin_role}
hints:
  - content: >-
      Compare the captured request body with the record it echoed back. How
      does the handler decide which fields you are allowed to change?
    cost: 15
    key: h1
  - content: >-
      PATCH /api/me merges your entire JSON body into the user record with no
      allowlist. The record has an is_admin field -- set it in the body.
    cost: 30
    key: h2
    requirements: [h1]
tags:
  - web
  - mass-assignment
  - authz
  - medium
files:
  - app.py
  - users.json
  - capture.http
state: visible
version: "0.1"
