name: hrportal-sqli2
author: ctf-2026
category: web
type: team_instance
description: |
  Injection SQL de second ordre -> contournement d'auth -> action admin.

  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 450
extra:
  docker_image: ctf-web-hrportal-sqli2:latest
  internal_port: 8080
  initial: 450
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: web-hrportal-sqli2

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      L'injection au login échoue (requêtes paramétrées). Où ton nom d'utilisateur est-il réutilisé plus tard ?
    cost: 20
    key: h1
  - content: >-
      Injection SQL de second ordre : enregistre un nom = payload UNION (zzz' UNION SELECT flag FROM secret-- -), connecte-toi, puis /dashboard interpole le nom stocké.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - web

# challenge-id (HMAC / requirements wiring): web-hrportal-sqli2
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

