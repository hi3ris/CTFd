# Run notes for race-the-coupon.
#
# The platform instancier builds/starts one container PER TEAM and injects that
# team's TEAM_SECRET. This compose file documents the exact runtime contract and
# is handy for local playtesting.
#
#   Build the image (name matters -- `make push-images` matches ^ctf-):
#     docker build -t ctf-race-the-coupon:latest .
#
#   Run one instance locally:
#     TEAM_SECRET=playtest-team-01 docker compose up
#
#   Then:
#     curl localhost:8080/api/wallet
#     python3 solution/solve.py http://localhost:8080
#
# In the arena the flag is derived from the real per-team TEAM_SECRET; locally
# it falls back to a dev value (see flag.py). Nothing sensitive is baked in.
services:
  race-the-coupon:
    build: .
    image: ctf-race-the-coupon:latest
    environment:
      # Per-team secret. In production this is set by the instancier, never here.
      - TEAM_SECRET=${TEAM_SECRET:-local-dev-secret}
    ports:
      - "8080:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 128
    restart: unless-stopped
