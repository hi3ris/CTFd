# Local run notes for authors / playtesters. In production the platform
# instancier injects SIGNING_KEY and TEAM_SECRET per team; this compose file
# is only for local build + smoke test.
#
#   docker compose up --build
#   # then browse http://localhost:8080/
#
services:
  jwt-cousin:
    build:
      context: .
    image: ctf-jwt-cousin:latest
    ports:
      - "8080:8080"
    environment:
      # local demo values ONLY -- never ship these
      SIGNING_KEY: "local-demo-signing-key-change-me"
      TEAM_SECRET: "local-demo-team-secret"
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
