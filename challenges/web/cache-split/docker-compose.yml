# Local run notes for web-cache-split (STUB).
#   docker build -t ctf-web-cache-split:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  web-cache-split:
    image: ctf-web-cache-split:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
