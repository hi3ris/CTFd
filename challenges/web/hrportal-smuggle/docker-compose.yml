# Local run notes for web-hrportal-smuggle (STUB).
#   docker build -t ctf-web-hrportal-smuggle:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  web-hrportal-smuggle:
    image: ctf-web-hrportal-smuggle:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
