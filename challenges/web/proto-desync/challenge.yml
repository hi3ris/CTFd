name: proto-desync
author: ctf-2026
category: web
type: team_instance
description: |
  Désync HTTP/2 -> vol de requête -> reprise de session privilégiée.

  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 550
extra:
  docker_image: ctf-web-proto-desync:latest
  internal_port: 8080
  initial: 550
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: web-proto-desync

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      L'ingest découpe le corps naïvement. Que fait-il d'une ligne « SMUGGLED GET ... » ?
    cost: 20
    key: h1
  - content: >-
      POST /ingest avec une ligne SMUGGLED GET /admin/flag (traitée comme requête pipelinée de confiance), puis GET /page?p=/admin/flag.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - web

# challenge-id (HMAC / requirements wiring): web-proto-desync
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # IMPLEMENTED + locally verified end-to-end (ported); flip to visible after Lot-5 Docker rehearsal; Lot-5 rehearsal passed 2026-09-23
version: "1.0"
