# Local run notes for web-proto-desync (STUB).
#   docker build -t ctf-web-proto-desync:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  web-proto-desync:
    image: ctf-web-proto-desync:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
