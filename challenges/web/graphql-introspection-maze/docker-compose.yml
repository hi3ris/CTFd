# Local run notes for authors / playtesters. In production the platform
# instancier injects TEAM_SECRET per team; this compose file is only for a
# local build + smoke test.
#
#   docker compose up --build
#   # then browse http://localhost:8080/  and POST to /graphql
#
services:
  graphql-introspection-maze:
    build:
      context: .
    image: ctf-graphql-introspection-maze:latest
    ports:
      - "8080:8080"
    environment:
      # local demo value ONLY -- never ship this
      TEAM_SECRET: "local-demo-team-secret"
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
