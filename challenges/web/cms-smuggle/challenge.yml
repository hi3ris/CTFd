name: cms-smuggle
author: ctf-2026
category: web
type: team_instance
description: |
  Request smuggling -> empoisonnement de cache -> contournement d'auth.

  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 500
extra:
  docker_image: ctf-web-cms-smuggle:latest
  internal_port: 8080
  initial: 500
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: web-cms-smuggle

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      L'ingest découpe le corps naïvement. Que fait-il d'une ligne « SMUGGLED GET ... » ?
    cost: 20
    key: h1
  - content: >-
      POST /ingest avec une ligne SMUGGLED GET /admin/flag (traitée comme requête pipelinée de confiance), puis GET /page?p=/admin/flag.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - web

# challenge-id (HMAC / requirements wiring): web-cms-smuggle
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: hidden  # IMPLEMENTED + locally verified end-to-end; flip to visible after Lot-5 Docker rehearsal
version: "1.0"
