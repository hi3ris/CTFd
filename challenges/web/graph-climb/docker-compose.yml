# Local run notes for web-graph-climb (STUB).
#   docker build -t ctf-web-graph-climb:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  web-graph-climb:
    image: ctf-web-graph-climb:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
