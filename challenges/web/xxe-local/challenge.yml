name: xxe-local
author: dagbanjaphet
category: web
description: |-
  An invoice-ingest endpoint parses uploaded XML. You get the parser source, a
  captured upload (invoice.xml), and a copy of the server's working directory.
  The endpoint echoes back the invoice <note>. A sensitive file sits in that
  same working directory.

  Endpoint (from the source):

      POST /invoice   -> parses the XML, returns the <note> text

  No live service. Work out what the parser would return for the captured
  upload.

  Stuck? Hints are available (they cost a few points).

  Flag format: NCTF{...}
value: 300
type: dynamic
extra:
  initial: 300
  decay: 25
  minimum: 100
flags:
  - NCTF{external_entity_reads_the_local_secret_file}
hints:
  - content: >-
      Look at the parser configuration and the captured XML's DOCTYPE. The
      parser is told to process external general entities.
    cost: 15
    key: h1
  - content: >-
      The document defines an entity SYSTEM "secret.flag" and expands it inside
      <note>. Resolve that entity against the shipped working directory to see
      what <note> becomes.
    cost: 30
    key: h2
    requirements: [h1]
tags:
  - web
  - xxe
  - xml
  - medium
files:
  - app.py
  - invoice.xml
  - secret.flag
state: visible
version: "0.1"
