name: ssrf-metadata-decoy
author: ctf-2026
category: web
type: team_instance
description: |
  **imgproxy** is a company image-fetch proxy: give it a URL and it fetches the
  bytes server-side so the CDN can cache and re-encode them.

      GET /fetch?url=https://example.com/logo.png

  The proxy runs on the app tier, which can reach an internal loopback service
  mesh that you cannot reach directly. Somewhere on that mesh an internal admin
  endpoint mints a **deploy token**. The server only hands that token to callers
  that reach the endpoint from inside the app tier -- i.e. *through the proxy*.
  Read what the app tier exposes about itself, get the proxy to hit the right
  internal endpoint, and the response comes back to you.

  The flag is emitted only when the internal admin endpoint is actually reached
  server-side -- it is not in any file you can download.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring (medium).
value: 350
extra:
  docker_image: ctf-ssrf-metadata-decoy:latest
  internal_port: 8080
  initial: 350
  decay: 30
  minimum: 100

# --- Per-team dynamic flag -------------------------------------------------
# SERVED challenge; the flag is derived per team, so no static flag ships here.
# The container derives it at runtime from the injected TEAM_SECRET as:
#     flag = "NCTF{" + HMAC_SHA256(TEAM_SECRET, "web-ssrf-metadata-decoy")[:24] + "}"
# (see flag.py). The internal admin service computes and returns exactly this
# value when its /admin/ping effect fires. The platform's custom per-account
# flag class recomputes and validates each team's flag on submission.
flags:
  - type: team_hmac
    content: web-ssrf-metadata-decoy

# Progressive, point-costing hints. The vuln detail lives here, not in the
# description: it has to be paid for.
hints:
  - content: >-
      `/fetch` will retrieve whatever URL you hand it, from the server's network
      position -- reach the internal mesh through it. The obvious link-local
      cloud target answers, but it's a deliberate dead end: its creds are stale
      and the flag never comes from there. Look for a less obvious internal
      service.
    cost: 20
    key: h1
  - content: >-
      Read `/robots.txt`: it names an internal registry on an odd port (9137)
      and points at an admin endpoint that issues the token. Both are app-tier
      only, reachable through the proxy.
    cost: 35
    key: h2
    requirements: [h1]
  - content: >-
      The loopback blocklist only rejects the literal `127.0.0.1` / `localhost`
      / `::1`. Use an alternate loopback encoding (`127.0.0.2`, `127.1`, decimal
      `2130706434`, hex `0x7f000002`) to reach port 9137: fetch `/` to read the
      registry, then `/admin/ping` to mint the flag.
    cost: 55
    key: h3
    requirements: [h2]

tags:
  - web
  - medium

# challenge-id (for HMAC / requirements wiring): web-ssrf-metadata-decoy
# Prerequisite chain: none. Standalone challenge.
# (If wired into a chain, prereqs are set by challenge ID at import time via a
#  'requirements' key referencing the upstream challenge id.)

# Served challenge: the platform instancier starts one container per team and
# injects TEAM_SECRET. Only port 8080 (the public proxy) is published; the
# decoy metadata (:80) and internal registry/admin (:9137) are reachable only
# via SSRF. connection_info is templated with the team's host:port.
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible
version: "0.1"

# Image built from the Dockerfile in this directory; must be named ctf-<name>
# so `make push-images` picks it up.
