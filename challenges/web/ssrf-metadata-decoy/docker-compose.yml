# Local run notes for ssrf-metadata-decoy.
#
#   docker build -t ctf-ssrf-metadata-decoy:latest .
#   docker compose up
#
# Only 8080 (the public proxy) is published. Ports 80 (decoy metadata) and
# 9137 (internal registry/admin) live inside the container and are reachable
# only via the SSRF -- that is the point.
#
# NET_ADMIN is required so the entrypoint can add 169.254.169.254 to `lo`.
# Without it the decoy falls back to 127.0.0.254 and the canonical link-local
# solve path won't answer.
services:
  ssrf-metadata-decoy:
    image: ctf-ssrf-metadata-decoy:latest
    build: .
    ports:
      - "8080:8080"
    cap_add:
      - NET_ADMIN
    environment:
      # Per team at deploy time. flag = CTF{ HMAC_SHA256(TEAM_SECRET, id)[:24] }
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
