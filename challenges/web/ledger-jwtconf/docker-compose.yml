# Local run notes for web-ledger-jwtconf (STUB).
#   docker build -t ctf-web-ledger-jwtconf:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  web-ledger-jwtconf:
    image: ctf-web-ledger-jwtconf:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
