name: ledger-jwtconf
author: ctf-2026
category: web
type: team_instance
description: |
  Confusion d'algorithme JWT -> forge -> endpoint interne exposé.

  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 400
extra:
  docker_image: ctf-web-ledger-jwtconf:latest
  internal_port: 8080
  initial: 400
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: web-ledger-jwtconf

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      Le service publie de quoi vérifier ses jetons. Que se passe-t-il si tu changes l'algorithme de signature déclaré dans l'en-tête ?
    cost: 20
    key: h1
  - content: >-
      Confusion RS256/HS256 : le vérificateur réutilise la clé publique RSA comme secret HMAC. Forge un jeton HS256 signé avec les octets exacts du PEM de /pubkey, role=admin.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - web

# challenge-id (HMAC / requirements wiring): web-ledger-jwtconf
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: hidden  # IMPLEMENTED + locally verified end-to-end (ported); flip to visible after Lot-5 Docker rehearsal
version: "1.0"
