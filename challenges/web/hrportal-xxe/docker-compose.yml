# Local run notes for web-hrportal-xxe (STUB).
#   docker build -t ctf-web-hrportal-xxe:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  web-hrportal-xxe:
    image: ctf-web-hrportal-xxe:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
