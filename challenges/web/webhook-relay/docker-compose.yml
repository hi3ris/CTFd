# Local run notes for web-webhook-relay (STUB).
#   docker build -t ctf-web-webhook-relay:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  web-webhook-relay:
    image: ctf-web-webhook-relay:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
