# Local run notes for web-reseau-pyramide.
#   docker build -t ctf-web-reseau-pyramide:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  web-reseau-pyramide:
    image: ctf-web-reseau-pyramide:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
