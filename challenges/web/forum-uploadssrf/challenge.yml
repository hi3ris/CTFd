name: forum-uploadssrf
author: ctf-2026
category: web
type: team_instance
description: |
  Contournement d'upload -> SSRF via le rendu -> lecture metadata.

  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 450
extra:
  docker_image: ctf-web-forum-uploadssrf:latest
  internal_port: 8080
  initial: 450
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: web-forum-uploadssrf

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      Le contrôle d'extension se fie-t-il au nom déclaré ? Et le rendu suit-il des URL ?
    cost: 20
    key: h1
  - content: >-
      Upload filename exploit.svg.png + content render:http://169.254.169.254/latest/meta-data/flag.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - web

# challenge-id (HMAC / requirements wiring): web-forum-uploadssrf
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # IMPLEMENTED + locally verified end-to-end (ported); flip to visible after Lot-5 Docker rehearsal; Lot-5 rehearsal passed 2026-09-23
version: "1.0"
