# Local run notes for sysadmin-rbac-climb (STUB).
#   docker build -t ctf-sysadmin-rbac-climb:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  sysadmin-rbac-climb:
    image: ctf-sysadmin-rbac-climb:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
