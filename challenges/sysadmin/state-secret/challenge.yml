name: state-secret
author: dagbanjaphet
category: sysadmin
description: |-
  A committed Terraform bundle: the config (`main.tf`), its state file
  (`terraform.tfstate`), the encryptor it calls (`encrypt.py`), and an encrypted
  secrets blob (`vault.enc`) that the config produced. The blob decrypts to a
  single secret. `encrypt.py` documents the exact blob format, so once you have
  the passphrase you can invert it.

  Recover it.

  Stuck? Hints are available (they cost a few points).

  Flag format: NCTF{...}
value: 450
type: dynamic
extra:
  initial: 450
  decay: 20
  minimum: 100
flags:
  - NCTF{tfstate_stores_secrets_in_plaintext_9d21}
hints:
  - content: >-
      Terraform state stores every resource attribute as plaintext JSON — even
      the ones marked sensitive in HCL. The key that protects the blob is
      sitting in the state file (mind the decoy provider credential).
    cost: 25
    key: h1
  - content: >-
      The passphrase is `random_password.vault.result` (also echoed in the
      `data.external.encrypt` query in state). The blob format is spelled out in
      the shipped `encrypt.py`: `b"ENC1" + salt(16) + iters(4 big-endian) +
      ciphertext`, with `key = PBKDF2-HMAC-SHA256(passphrase, salt, iters)` and a
      `SHA256(key || counter)` XOR keystream. Read `encrypt.py` and invert it.
    cost: 45
    key: h2
    requirements: [h1]
tags:
  - sysadmin
  - terraform
  - secrets
  - hard
files:
  - main.tf
  - terraform.tfstate
  - encrypt.py
  - vault.enc
state: visible
version: "0.1"
