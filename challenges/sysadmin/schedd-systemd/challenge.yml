name: schedd-systemd
author: ctf-2026
category: sysadmin
type: team_instance
description: |
  Injection d'env -> unit systemd -> sudo mal configuré -> root.

  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 500
extra:
  docker_image: ctf-sysadmin-schedd-systemd:latest
  internal_port: 8080
  initial: 500
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: sysadmin-schedd-systemd

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      L'unit root lit un env drop-in éditable. La doc ne parle que de LOG_LEVEL — mais est-ce filtré ?
    cost: 20
    key: h1
  - content: >-
      POST /set-env BACKUP_ARGS=--dump-secrets, puis GET /start.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - sysadmin

# challenge-id (HMAC / requirements wiring): sysadmin-schedd-systemd
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # IMPLEMENTED + locally verified end-to-end; flip to visible after Lot-5 Docker rehearsal; Lot-5 rehearsal passed 2026-09-23
version: "1.0"
