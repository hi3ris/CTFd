name: rotatord-cron
author: ctf-2026
category: sysadmin
type: team_instance
description: |
  Injection de chemin -> cron -> root.

  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 450
extra:
  docker_image: ctf-sysadmin-rotatord-cron:latest
  internal_port: 8080
  initial: 450
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: sysadmin-rotatord-cron

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      Le cron root lance `backup` via PATH. Un des dossiers du PATH est-il inscriptible et prioritaire ?
    cost: 20
    key: h1
  - content: >-
      Dépose un `backup` (action emit-flag) dans /opt/tools, puis GET /run-cron.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - sysadmin

# challenge-id (HMAC / requirements wiring): sysadmin-rotatord-cron
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # IMPLEMENTED + locally verified end-to-end (ported); flip to visible after Lot-5 Docker rehearsal; Lot-5 rehearsal passed 2026-09-23
version: "1.0"
