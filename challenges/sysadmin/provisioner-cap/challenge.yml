name: provisioner-cap
author: ctf-2026
category: sysadmin
type: team_instance
description: |
  Capability mal configurée -> escalade -> root.

  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 500
extra:
  docker_image: ctf-sysadmin-provisioner-cap:latest
  internal_port: 8080
  initial: 500
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: sysadmin-provisioner-cap

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      Regarde les capabilities des binaires. Lequel en a une bien trop large ?
    cost: 20
    key: h1
  - content: >-
      logtool porte cap_dac_read_search : /exec?bin=logtool&args=--read=/flag.txt.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - sysadmin

# challenge-id (HMAC / requirements wiring): sysadmin-provisioner-cap
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: hidden  # IMPLEMENTED + locally verified end-to-end (ported); flip to visible after Lot-5 Docker rehearsal
version: "1.0"
