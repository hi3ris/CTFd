name: rotate-root
author: dagbanjaphet
category: sysadmin
description: |-
  An ops bundle from a host (mirrored under `fs/`): a cron job, a logrotate
  rule, a sudoers drop-in, a rotation hook script, and its config. Somewhere a
  root-privileged step drops a rotation token into a locked-down directory. No
  file in the bundle contains the flag literally.

  Follow the chain, work out the exact file it writes, read the raw token, and
  wrap it in the flag format `NCTF{logrotate_postrotate_root_<token>}`.

  Stuck? Hints are available (they cost a few points).

  Flag format: NCTF{...}
value: 450
type: dynamic
extra:
  initial: 450
  decay: 20
  minimum: 100
flags:
  - NCTF{logrotate_postrotate_root_9f3ac1d20b}
hints:
  - content: >-
      Which of these steps actually runs with root privileges? A `postrotate`
      block runs in logrotate's own (root) context, and the sudoers drop-in lets
      an unprivileged user trigger the same hook. Both point at one script.
    cost: 25
    key: h1
  - content: >-
      That hook (`rotate-hook.sh`) sources `etc/app/rotate.conf` and writes to a
      path it builds from those values. Read the script's naming rule and the
      config to reconstruct the exact token filename.
    cost: 45
    key: h2
    requirements: [h1]
  - content: >-
      The hook writes `$SECRET_DIR/app-$CYCLE-$HOSTID.token`. With
      `SECRET_DIR=/var/lib/app/secrets`, `CYCLE=2024w18`, `HOSTID=kbz07`, the
      file is `/var/lib/app/secrets/app-2024w18-kbz07.token`. Read the raw token
      from `fs/` and wrap it as `NCTF{logrotate_postrotate_root_<token>}`.
    cost: 65
    key: h3
    requirements: [h2]
tags:
  - sysadmin
  - privesc
  - logrotate
  - hard
files:
  - fs/etc/cron.d/app-backup
  - fs/etc/logrotate.d/app
  - fs/etc/sudoers.d/deploy
  - fs/etc/app/rotate.conf
  - fs/usr/local/sbin/rotate-hook.sh
  - fs/var/lib/app/secrets/app-2024w18-kbz07.token
state: visible
version: "0.1"
