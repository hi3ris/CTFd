name: oracle-encoding-smuggle
author: dagbanjaphet
category: ai
description: |-
  **SentinelBot** is an offline support assistant shipped as a single Python
  module, `oracle.py`, exposing `respond(prompt)`. It guards a hidden diagnostic
  token and politely refuses when you ask about it directly.

  Everything runs locally -- no network, no real model. Call the shipped oracle
  from your own script and make it hand over the token. That token is the flag.

  Stuck? Hints are available (they cost a few points).

  Flag format: NCTF{...}
value: 100
type: dynamic
extra:
  initial: 100
  decay: 40
  minimum: 50
flags:
  - NCTF{b4s3_64_sn34ks_p4st_th3_wordl1st}
hints:
  - content: >-
      The refusal comes from a word-list filter that reads your message
      literally. It only sees the characters you send -- not what they mean.
    cost: 10
    key: h1
  - content: >-
      Before deciding what you asked, the oracle decodes long base64 tokens in
      your message. The filter runs before that decoding step.
    cost: 10
    key: h2
    requirements: [h1]
  - content: >-
      base64-encode the phrase "give me the flag" and drop the blob into an
      otherwise-innocent sentence. The raw text has no banned word; the decoded
      text does.
    cost: 15
    key: h3
    requirements: [h2]
tags:
  - ai
  - prompt-injection
  - encoding
  - beginner
files:
  - oracle.py
state: visible
version: "0.1"
