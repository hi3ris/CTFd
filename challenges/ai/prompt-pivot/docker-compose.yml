# Local run notes for ai-prompt-pivot (STUB).
#   docker build -t ctf-ai-prompt-pivot:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  ai-prompt-pivot:
    image: ctf-ai-prompt-pivot:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
