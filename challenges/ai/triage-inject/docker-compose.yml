# Local run notes for ai-triage-inject (STUB).
#   docker build -t ctf-ai-triage-inject:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  ai-triage-inject:
    image: ctf-ai-triage-inject:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
