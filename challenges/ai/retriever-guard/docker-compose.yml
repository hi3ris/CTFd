# Local run notes for ai-retriever-guard (STUB).
#   docker build -t ctf-ai-retriever-guard:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  ai-retriever-guard:
    image: ctf-ai-retriever-guard:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
