# Local run notes for authors / playtesters. In production the platform
# instancier injects TEAM_SECRET per team and points OLLAMA_URL at that team's
# tool-capable Ollama backend. This compose file is only for a local build +
# smoke test.
#
#   docker compose up --build
#   # first run pulls llama3.1:8b into the ollama volume (a few GB, one-time)
#   docker compose exec ollama ollama pull llama3.1:8b
#   # then browse http://localhost:8080/
#
# llama3.1:8b supports Ollama tool calling, which this challenge requires. To
# smoke-test the tool loop + effect oracle WITHOUT a model/GPU, run the app with
# MODEL_BACKEND=stub (see solution/solve.py).
services:
  ollama:
    image: ollama/ollama:latest
    expose:
      - "11434"
    volumes:
      - ollama:/root/.ollama
    # deploy:                     # uncomment on a GPU host
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: ["gpu"]

  helm:
    build:
      context: .
    image: ctf-ai3-tool-abuse:latest
    depends_on:
      - ollama
    ports:
      - "8080:8080"
    environment:
      # local demo value ONLY -- never ship this
      TEAM_SECRET: "local-demo-team-secret"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "llama3.1:8b"
      MODEL_BACKEND: "ollama"
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m

volumes:
  ollama:
