# Local run notes for authors / playtesters. In production the platform
# instancier injects per-CHALLENGE values (CHALLENGE_SECRET, and FLAG) per
# instance and points OLLAMA_URL at that team's Ollama backend; TEAM_SECRET is
# no longer injected. This compose file is only for a local build + smoke test
# and uses the code's TEAM_SECRET dev fallback to derive CHALLENGE_SECRET.
#
#   docker compose up --build
#   # first run pulls llama3.1:8b into the ollama volume (a few GB, one-time)
#   docker compose exec ollama ollama pull llama3.1:8b
#   # then browse http://localhost:8080/
#
# The guard service does NOT need a GPU; the Ollama sidecar will use one if the
# host exposes it (uncomment the deploy block), otherwise it runs on CPU.
services:
  ollama:
    image: ollama/ollama:latest
    # Not published to the host in production; the guard talks to it over the
    # internal network only.
    expose:
      - "11434"
    volumes:
      - ollama:/root/.ollama
    # deploy:                     # uncomment on a GPU host
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: ["gpu"]

  guard:
    build:
      context: .
    image: ctf-ai1-naive-guard:latest
    depends_on:
      - ollama
    ports:
      - "8080:8080"
    environment:
      # Local dev ONLY. The arena injects CHALLENGE_SECRET (+ FLAG) per
      # instance; here we let the code's dev fallback derive CHALLENGE_SECRET
      # from this TEAM_SECRET so local runs still work. Never ship this.
      TEAM_SECRET: "local-demo-team-secret"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "llama3.1:8b"
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m

volumes:
  ollama:
