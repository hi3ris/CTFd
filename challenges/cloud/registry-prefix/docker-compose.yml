# Local run notes for cloud-registry-prefix (STUB).
#   docker build -t ctf-cloud-registry-prefix:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  cloud-registry-prefix:
    image: ctf-cloud-registry-prefix:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
