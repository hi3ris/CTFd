name: backup-prefix
author: ctf-2026
category: cloud
type: team_instance
description: |
  Préfixe public -> credential fuité -> escalade de rôle.

  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 450
extra:
  docker_image: ctf-cloud-backup-prefix:latest
  internal_port: 8080
  initial: 450
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: cloud-backup-prefix

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      Le préfixe public/ est listable. Que traîne-t-il dans les objets publics ?
    cost: 20
    key: h1
  - content: >-
      Credential fuité : public/backup-notes.txt contient deploy_secret=AKIA... ; /assume?secret=... rend un jeton de rôle qui lit /get?key=private/flag (X-Role-Token).
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - cloud

# challenge-id (HMAC / requirements wiring): cloud-backup-prefix
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # Lot-5 rehearsal passed
version: "1.0"
