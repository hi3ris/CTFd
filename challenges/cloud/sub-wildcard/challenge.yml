name: sub-wildcard
author: dagbanjaphet
category: cloud
description: |-
  The `ci-deployer` IAM role trusts GitHub Actions via OIDC. You have its trust
  policy, its attached permissions, the decoded claims of an OIDC token that was
  presented to it (`oidc-token.json`), and a release secret whose value is sealed
  in the handout (`release-secret.json`).

  Show that this token can assume the role, then recover the secret. The flag is
  the secret.

  Stuck? Hints are available (they cost a few points).

  Flag format: NCTF{...}
value: 300
type: dynamic
extra:
  initial: 300
  decay: 25
  minimum: 100
flags:
  - NCTF{oidc_sub_wildcard_assumed_the_role}
hints:
  - content: >-
      OIDC trust policies gate on claims. Compare the `StringLike` condition on
      the `sub` claim in the trust policy against the `sub` in the captured
      token.
    cost: 15
    key: h1
  - content: >-
      The trust condition matches `repo:kekeli-cloud/*` — any repo in the org,
      not one repo/branch. A fork in the same org is admitted. That admitted
      `sub` string is exactly what seals the secret.
    cost: 30
    key: h2
    requirements: [h1]
  - content: >-
      The secret's XOR keystream is SHA256(sub), where `sub` is the token claim
      that satisfied the wildcard. Derive the keystream and XOR the base64
      ciphertext.
    cost: 45
    key: h3
    requirements: [h2]
tags:
  - cloud
  - aws
  - oidc
  - sts
  - trust-policy
  - medium
files:
  - trust-policy.json
  - role-permissions.json
  - oidc-token.json
  - release-secret.json
state: visible
version: "0.1"
