# Local run notes for cloud-bucket-pivot (STUB).
#   docker build -t ctf-cloud-bucket-pivot:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  cloud-bucket-pivot:
    image: ctf-cloud-bucket-pivot:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
