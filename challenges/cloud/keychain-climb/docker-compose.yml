# Local run notes for cloud-keychain-climb (STUB).
#   docker build -t ctf-cloud-keychain-climb:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  cloud-keychain-climb:
    image: ctf-cloud-keychain-climb:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
