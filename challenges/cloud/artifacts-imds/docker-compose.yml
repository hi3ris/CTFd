# Local run notes for cloud-artifacts-imds (STUB).
#   docker build -t ctf-cloud-artifacts-imds:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  cloud-artifacts-imds:
    image: ctf-cloud-artifacts-imds:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
