# Local run notes for cloud-func-inject (STUB).
#   docker build -t ctf-cloud-func-inject:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  cloud-func-inject:
    image: ctf-cloud-func-inject:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
