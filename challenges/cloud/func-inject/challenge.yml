name: func-inject
author: ctf-2026
category: cloud
type: team_instance
description: |
  Injection d'env dans une fonction -> exécution -> vol de secret de plateforme.

  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 500
extra:
  docker_image: ctf-cloud-func-inject:latest
  internal_port: 8080
  initial: 500
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: cloud-func-inject

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      /invoke accepte un objet env. La doc ne liste que LOG_LEVEL et REGION — mais le runtime filtre-t-il vraiment les clés ?
    cost: 20
    key: h1
  - content: >-
      Passe env.INIT_HOOK avec une valeur bidon : l'erreur fuite le registre des hooks (dont un hook debug « reveal »). Rejoue avec INIT_HOOK=reveal.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - cloud
  - cve

# challenge-id (HMAC / requirements wiring): cloud-func-inject
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # IMPLEMENTED + locally verified end-to-end (ported); flip to visible after Lot-5 Docker rehearsal; Lot-5 rehearsal passed 2026-09-23
version: "1.0"
