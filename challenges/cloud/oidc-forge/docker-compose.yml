# Local run notes for cloud-oidc-forge (STUB).
#   docker build -t ctf-cloud-oidc-forge:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  cloud-oidc-forge:
    image: ctf-cloud-oidc-forge:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
