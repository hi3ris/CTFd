name: breach-chain
author: dagbanjaphet
category: cloud
type: team_instance
description: |
  **Kékéli Cloud.** Le service de prévisualisation média de Kékéli Cloud tourne
  sur `http://{host}:{port}` : donnez-lui une URL, il la récupère **côté
  serveur** et vous montre le résultat.

  Objectif : mettre la main sur le secret que garde l'**API d'administration
  interne** de la plateforme. Rien n'est téléchargeable ; tout ce qu'il faut vit
  dans le conteneur. À vous d'enchaîner la compromission.

  Instance par équipe : chaque équipe a son conteneur et son flag. Bloqué ?
  Des indices sont disponibles (ils coûtent quelques points).

  Flag format : `NCTF{...}`

  Connexion : `http://{host}:{port}`

# Dynamic scoring (medium-hard).
value: 450
extra:
  docker_image: ctf-breach-chain:latest
  internal_port: 8080
  initial: 450
  decay: 25
  minimum: 100

# --- Per-team dynamic flag -------------------------------------------------
# SERVED, per-team. No static flag ships here. The container derives it at
# runtime from the injected CHALLENGE_SECRET (flag body = CHALLENGE_SECRET[:24];
# see flag.py) and returns it only from /api/admin/secrets once the stolen
# app-role Token is presented. The team_hmac flag class validates it on submit.
flags:
  - type: team_hmac
    content: cloud-breach-chain

# Indices progressifs (déverrouillage en chaîne, coût croissant). Le détail de
# la vuln n'est PAS dans la description : il se paie ici.
hints:
  - content: >-
      Le récupérateur d'URL s'exécute SUR l'instance applicative — il peut
      joindre des services que vous, non. Les plateformes cloud exposent un
      service de métadonnées d'instance à une adresse interne bien connue.
    cost: 25
    key: h1
  - content: >-
      La blocklist de /fetch ne rejette que quelques littéraux (127.0.0.1,
      localhost, ::1). D'autres façons d'écrire « la machine locale » passent
      (0.0.0.0, IP décimale, …). Servez-vous-en pour atteindre le service de
      métadonnées (style IMDS) et lire les identifiants du rôle de l'app.
    cost: 50
    key: h2
    requirements: [h1]
  - content: >-
      Le rôle de l'app expose un `Token` temporaire (attention à un rôle leurre
      aux creds expirés). Rejouez ce Token en en-tête `X-App-Token` sur
      `GET /api/admin/secrets` : il renvoie le flag.
    cost: 75
    key: h3
    requirements: [h2]

tags:
  - cloud
  - scenario
  - medium

# challenge-id (HMAC / requirements wiring): cloud-breach-chain
connection_info: "http://{host}:{port}  (per-team instance; use the 'launch' button)"

state: visible
version: "0.1"

# Image built from the Dockerfile here; must be named ctf-breach-chain:latest
# so `deploy/local/build-images.sh` / `make push-images` pick it up.
