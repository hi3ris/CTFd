# Local run notes for cloud-queue-presign (STUB).
#   docker build -t ctf-cloud-queue-presign:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  cloud-queue-presign:
    image: ctf-cloud-queue-presign:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
