name: billing-imds
author: ctf-2026
category: cloud
type: team_instance
description: |
  SSRF -> IMDS -> assume-role -> lecture d'objet privé.

  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 500
extra:
  docker_image: ctf-cloud-billing-imds:latest
  internal_port: 8080
  initial: 500
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: cloud-billing-imds

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      Le fetcher de manifests ne bloque pas toutes les adresses. Quelle adresse spéciale un service cloud expose-t-il en interne ?
    cost: 20
    key: h1
  - content: >-
      SSRF -> IMDS : /fetch?url=http://169.254.169.254/latest/meta-data/iam/security-credentials/backup-role donne un Token de rôle, puis /objects/flag avec X-Role-Token.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - cloud

# challenge-id (HMAC / requirements wiring): cloud-billing-imds
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # Lot-5 rehearsal passed
version: "1.0"
