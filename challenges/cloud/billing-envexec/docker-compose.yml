# Local run notes for cloud-billing-envexec (STUB).
#   docker build -t ctf-cloud-billing-envexec:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  cloud-billing-envexec:
    image: ctf-cloud-billing-envexec:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
