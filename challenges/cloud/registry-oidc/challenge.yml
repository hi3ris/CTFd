name: registry-oidc
author: ctf-2026
category: cloud
type: team_instance
description: |
  Mauvaise config OIDC -> jeton forgé -> API privilégiée.

  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 500
extra:
  docker_image: ctf-cloud-registry-oidc:latest
  internal_port: 8080
  initial: 500
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: cloud-registry-oidc

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      Le serveur fait confiance au champ alg de l'en-tête du jeton. Que se passe-t-il avec alg=none ?
    cost: 20
    key: h1
  - content: >-
      Misconfig alg:none : forge un jeton non signé {alg:none} avec groups=[platform-admin], troisième segment vide. Aucune clé requise.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - cloud

# challenge-id (HMAC / requirements wiring): cloud-registry-oidc
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # Lot-5 rehearsal passed
version: "1.0"
