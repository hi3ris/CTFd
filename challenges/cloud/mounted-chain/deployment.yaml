apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-worker
  namespace: kekeli
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-worker
  template:
    metadata:
      labels:
        app: media-worker
    spec:
      serviceAccountName: media-worker
      containers:
        - name: worker
          image: registry.kekeli.internal/media-worker:1.4.2
          volumeMounts:
            - name: vault
              mountPath: /var/run/secrets/app
              readOnly: true
      volumes:
        - name: vault
          secret:
            secretName: media-worker-vault
