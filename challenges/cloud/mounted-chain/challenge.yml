name: mounted-chain
author: dagbanjaphet
category: cloud
description: |-
  A dump of the `kekeli` Kubernetes namespace: a ServiceAccount, a Role, a
  RoleBinding, a Deployment, and the Secret it mounts. One workload is allowed
  to read a secret it should not be able to fully use.

  Recover what the mounted token really contains. The flag is in there.

  Stuck? Hints are available (they cost a few points).

  Flag format: NCTF{...}
value: 150
type: dynamic
extra:
  initial: 150
  decay: 35
  minimum: 50
flags:
  - NCTF{rbac_get_secrets_then_base64_twice}
hints:
  - content: >-
      Follow the RBAC first: the RoleBinding ties the ServiceAccount to a Role
      whose verbs let it read Secrets. That is the object worth looking at.
    cost: 10
    key: h1
  - content: >-
      Kubernetes already base64-encodes values under `data:`. Decode the
      `token` field once and look at what you get — it is not the flag yet.
    cost: 20
    key: h2
    requirements: [h1]
tags:
  - cloud
  - kubernetes
  - rbac
  - base64
  - easy
files:
  - serviceaccount.yaml
  - role.yaml
  - rolebinding.yaml
  - deployment.yaml
  - secret.yaml
state: visible
version: "0.1"
