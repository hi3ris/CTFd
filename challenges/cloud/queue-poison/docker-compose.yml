# Local run notes for cloud-queue-poison (STUB).
#   docker build -t ctf-cloud-queue-poison:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  cloud-queue-poison:
    image: ctf-cloud-queue-poison:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
