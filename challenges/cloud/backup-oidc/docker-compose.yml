# Local run notes for cloud-backup-oidc (STUB).
#   docker build -t ctf-cloud-backup-oidc:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  cloud-backup-oidc:
    image: ctf-cloud-backup-oidc:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
