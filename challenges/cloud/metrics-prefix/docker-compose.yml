# Local run notes for cloud-metrics-prefix (STUB).
#   docker build -t ctf-cloud-metrics-prefix:latest .
#   docker compose up
#   # browse http://localhost:8080/
services:
  cloud-metrics-prefix:
    image: ctf-cloud-metrics-prefix:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      TEAM_SECRET: "devsecret"
    restart: unless-stopped
