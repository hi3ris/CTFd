name: artifacts-presign
author: ctf-2026
category: cloud
type: team_instance
description: |
  Abus d'URL pré-signée -> écriture d'objet -> exécution au déploiement.

  This instance's flag is on the service's filesystem, served by no route.
  Exploit the service to read it.

  Stuck? Hints are available (they cost a few points).

  Flag format: `NCTF{...}`

# Dynamic scoring.
value: 500
extra:
  docker_image: ctf-cloud-artifacts-presign:latest
  internal_port: 8080
  initial: 500
  decay: 25
  minimum: 100

# SERVED challenge; per-team flag, no static flag ships here.
flags:
  - type: team_hmac
    content: cloud-artifacts-presign

# Progressive, point-costing hints. Fill these when the vuln is implemented; the
# CVE id (if any) goes in a paid hint, never in the description.
hints:
  - content: >-
      /presign te rend une URL PUT signée. Le contrat dit « uniquement le préfixe uploads/ » — mais l'émetteur vérifie-t-il vraiment le préfixe ?
    cost: 20
    key: h1
  - content: >-
      Fais signer une PUT pour hooks/postdeploy (préfixe privilégié), écris le sentinel « emit-flag », déclenche /deploy, puis lis /get?key=artifacts/deploy.log.
    cost: 40
    key: h2
    requirements: [h1]

tags:
  - cloud
  - medium

# challenge-id (HMAC / requirements wiring): cloud-artifacts-presign
connection_info: "http://{host}:{port}/  (per-team instance; use the 'launch' button)"

state: visible  # IMPLEMENTED + locally verified end-to-end (ported); flip to visible after Lot-5 Docker rehearsal; Lot-5 rehearsal passed 2026-09-23
version: "1.0"
