{% extends "admin/challenges/update.html" %}

{% block value %}
<div class="form-group">
	<label>Docker image</label>
	<input type="text" class="form-control" name="docker_image" value="{{ challenge.docker_image }}">
</div>
<div class="form-group">
	<label>Internal port</label>
	<input type="number" class="form-control" name="internal_port" value="{{ challenge.internal_port }}">
</div>
<div class="form-group">
	<label>Initial Value</label>
	<input type="number" class="form-control" name="initial" value="{{ challenge.initial }}">
</div>
<div class="form-group">
	<label>Decay Function</label>
	<select name="function" class="custom-select">
		<option value="logarithmic" {% if challenge.function == 'logarithmic' %}selected{% endif %}>Logarithmic</option>
		<option value="linear" {% if challenge.function == 'linear' %}selected{% endif %}>Linear</option>
	</select>
</div>
<div class="form-group">
	<label>Decay</label>
	<input type="number" class="form-control" name="decay" value="{{ challenge.decay }}">
</div>
<div class="form-group">
	<label>Minimum Value</label>
	<input type="number" class="form-control" name="minimum" value="{{ challenge.minimum }}">
</div>
{% endblock %}
