{% extends "base.html" %}

{% block content %}
<div class="container term-error">
	<div class="term-window" role="alert">
		<div class="term-bar">
			<i class="d1"></i><i class="d2"></i><i class="d3"></i>
			<span class="path">nctf@arena:~$ noyau</span>
		</div>
		<div class="term-body">
			<p class="term-code">500</p>
			<p class="l"><span class="p">$</span> <span class="cmd">exec {{ request.path }}</span></p>
			<p class="l"><span class="code fail">[panic]</span> <span class="fail">erreur interne</span></p>
			<p class="msg">{% if error %}{{ error }}{% else %}Quelque chose a cassé de notre côté. L'équipe a été prévenue.{% endif %}</p>
			<p class="l"><span class="p">$</span> <a class="back" href="{{ request.script_root }}/">cd /</a> <span class="caret">_</span></p>
		</div>
	</div>
</div>
{% endblock %}

{% block scripts %}
{% endblock %}
