{% extends "base.html" %}

{% block content %}
<div class="container term-error">
	<div class="term-window" role="alert">
		<div class="term-bar">
			<i class="d1"></i><i class="d2"></i><i class="d3"></i>
			<span class="path">nctf@arena:~$ passerelle</span>
		</div>
		<div class="term-body">
			<p class="term-code">502</p>
			<p class="l"><span class="p">$</span> <span class="cmd">proxy {{ request.path }}</span></p>
			<p class="l"><span class="code fail">[down]</span> <span class="fail">passerelle injoignable</span></p>
			<p class="msg">Le service redémarre probablement. Patiente quelques secondes puis recharge.</p>
			<p class="l"><span class="p">$</span> <a class="back" href="{{ request.script_root }}/">reload</a> <span class="caret">_</span></p>
		</div>
	</div>
</div>
{% endblock %}

{% block scripts %}
{% endblock %}
