# Configuration de DEMARRAGE : HTTP seul.
#
# Elle sert a deux choses : faire tourner le site avant qu'un certificat
# existe, et repondre au challenge ACME de Let's Encrypt. Des que
# `make tls-init` a obtenu le certificat, nginx bascule sur tls.conf.
#
# Ne laissez pas le CTF tourner sur cette configuration : 300 joueurs y
# enverraient leur mot de passe en clair.

upstream ctfd {
    server ctfd:8000;
}

server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 100M;

    location / {
        proxy_pass http://ctfd;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}
