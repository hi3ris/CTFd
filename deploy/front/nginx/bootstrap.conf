# Configuration de DEMARRAGE : HTTP seul.
#
# Elle sert a deux choses : faire tourner le site avant qu'un certificat
# existe, et repondre au challenge ACME de Let's Encrypt. Des que
# `make tls-init` a obtenu le certificat, nginx bascule sur tls.conf.
#
# Ne laissez pas le CTF tourner sur cette configuration : 300 joueurs y
# enverraient leur mot de passe en clair.

upstream ctfd {
    server ctfd:8000;
}

server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 100M;

    location / {
        proxy_pass http://ctfd;
        include /etc/nginx/conf.d/proxy-headers.inc;

        # Durcissement de la fenetre de demarrage. tls.conf ferme les Host
        # inconnus avec un `return 444` sur un server_name dedie ; bootstrap.conf
        # est copie tel quel (sans le `sed` de `make tls-init`) et ne connait
        # donc pas encore le domaine. On neutralise a la place l'injection de
        # Host en figeant les en-tetes en amont sur une valeur constante : quel
        # que soit le Host envoye par le client, CTFd ne fabriquera pas de lien
        # de reinitialisation pointant chez un attaquant pendant cette phase.
        proxy_set_header Host             bootstrap.invalid;
        proxy_set_header X-Forwarded-Host bootstrap.invalid;
    }
}
