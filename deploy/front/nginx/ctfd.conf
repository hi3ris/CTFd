# Reverse proxy CTFd. Le certificat est gere par certbot (volume partage).
#
# Tant que `make tls-init` n'a pas tourne, le bloc 443 n'a pas de certificat :
# nginx refuserait de demarrer. Le fichier est donc ecrit en deux temps par
# `make tls-init`, qui decommente le bloc HTTPS une fois le certificat obtenu.

upstream ctfd {
    server ctfd:8000;
}

# Cache des fichiers statiques : evite de reveiller gunicorn pour chaque asset.
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=ctfd_static:10m
                 max_size=256m inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name _;

    # Renouvellement Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tout le reste part en HTTPS. Commente tant que le certificat n'existe pas.
    # return 301 https://$host$request_uri;

    client_max_body_size 100M;

    location / {
        proxy_pass http://ctfd;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Les challenges IA repondent en streaming : pas de bufferisation,
        # et un timeout large pour laisser le modele generer.
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }

    location /themes/ {
        proxy_pass         http://ctfd;
        proxy_cache        ctfd_static;
        proxy_cache_valid  200 60m;
        proxy_set_header   Host $host;
        add_header         X-Cache-Status $upstream_cache_status;
    }
}

