# Backlog de challenges SERVIS à combinaisons de vulnérabilités.
#
# Chaque entrée = un challenge servi (per-team flag, état live, aucun artefact
# téléchargeable) combinant AU MOINS DEUX vulnérabilités chaînées. C'est la
# direction anti-solve-IA (cf. deploy/ai-resistance-audit.md) : déplacer le poids
# du tableau vers le servi.
#
# Ce fichier alimente le générateur de squelettes :
#     make scaffold-backlog          # stampe TOUS les squelettes (STUBS cachés)
#     python3 deploy/scripts/scaffold_served.py --manifest deploy/served-backlog.yml
#
# Un squelette est un STUB (state: hidden, app placeholder, solveur non
# implémenté). La session de build remplit la vuln + le solveur, vérifie l'exploit
# en local (Docker), puis flip state: visible. RIEN ici n'est un challenge fini :
# c'est le plan de travail, pas 40 challenges livrés.
#
# `summary` reste au niveau design (classe + chaîne), jamais un payload.
# `cve` (optionnel) : tag cve-ancré ; l'id ira dans un indice payant, pas l'énoncé.

# ── Les 6 chaînes nommées du blueprint (deploy/challenge-chains-blueprint.md) ──
- { name: chains/vaultboard, points: 500, title: Vaultboard, cve: true, summary: "SSRF -> jeton scopé interne -> objet mal-ACLé (web -> cloud -> objets)." }
- { name: chains/clinic, points: 450, title: Clinic, summary: "Jeton de session prévisible -> IDOR export -> action admin (auth -> IDOR -> admin)." }
- { name: chains/pipeline, points: 550, title: Pipeline, cve: true, summary: "Confusion de dépendance / dérive de lockfile -> hook de build exécuté -> RCE runner." }
- { name: chains/citadel, points: 600, title: Citadel, summary: "Foothold web -> priv-esc user (credential réutilisé) -> priv-esc root (SUID/sudo)." }
- { name: chains/tokenforge, points: 500, title: Token Forge, summary: "Oracle crypto -> cookie admin forgé -> endpoint caché avec SSTI/désérialisation." }
- { name: chains/relay, points: 500, title: Relay, summary: "Reverse d'un protocole binaire maison -> commande cachée -> bug mémoire exploité." }

